name: Rename HTML to index
on:
  workflow_dispatch:
jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rename file to index.html
        run: |
          mv receitasfaceishub.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rename receitasfaceishub.html to index.html"
          git push
