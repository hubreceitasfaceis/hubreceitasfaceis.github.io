name: Add GSC verification tag
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  add-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert verification meta tag
        run: |
          python3 << 'PY'
          import pathlib, re
          p = pathlib.Path("index.html")
          t = p.read_text(encoding="utf-8")
          tag = '<meta name="google-site-verification" content="HoWofmErOOKMSn8dHeXvBTb5cGoEBEB1rQ7Y3CrUYgY" />'
          if "google-site-verification" in t:
              print("already present")
          else:
              m = re.search(r"<head[^>]*>", t, re.I)
              if not m:
                  raise SystemExit("no head tag found")
              t = t[:m.end()] + "\n    " + tag + t[m.end():]
              p.write_text(t, encoding="utf-8")
              print("inserted")
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add Google Search Console verification meta tag"
          git push
